readme = "README.md"
authors = [
    { name = "Babacar Faye", email = "bf322003@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "ipykernel>=7.4.0",
    "langchain>=1.4.6",
    "langchain-community>=0.4.2",
    "langchain-ollama>=1.1.0",
